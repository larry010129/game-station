[package]
name = "command-cms"
version = "0.1.0"
description = "Command CMS: content publishing for Command Station (themes, items, odds, banners, releases)"
edition = "2021"

[lib]
name = "command_cms_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
