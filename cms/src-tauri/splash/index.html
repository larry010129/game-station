<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Command CMS</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #0a0a0b; color: #efefef; font: 300 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  .box { text-align: center; max-width: 520px; padding: 24px; }
  h1 { font-weight: 300; font-size: 22px; margin: 0 0 8px; letter-spacing: 0.02em; }
  p { margin: 0; color: #a1a1a6; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f0893a; margin-right: 8px; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }
  #err { display: none; margin-top: 14px; color: #ff8b8f; white-space: pre-wrap; }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
  <div class="box">
    <h1>Command CMS</h1>
    <p id="msg"><span class="dot"></span>Starting the content server…</p>
    <p id="err"></p>
  </div>
  <script>
    // The desktop shell calls this when the server could not start.
    window.cmsFailed = function (text) {
      document.getElementById("msg").textContent = "The content server did not start.";
      var e = document.getElementById("err");
      e.textContent = text;
      e.style.display = "block";
    };
  </script>
</body>
</html>
