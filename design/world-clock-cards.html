/* Tokens and tile rules below are copied from app/src/styles/app.css */
:root{--bg:#0a0a0b;--glass:rgba(28,28,30,.66);--glass-hi:rgba(255,255,255,.06);--edge:rgba(255,255,255,.1);--edge-2:rgba(255,255,255,.22);--text:#efefef;--dim:#9a9a9e;--mute:#75757a;--orange:#f0893a;--red:#e5484d;--ui:"Outfit","Segoe UI",system-ui,sans-serif;--r:16px;--ease:cubic-bezier(.16,1,.3,1);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:300 14px/1.4 var(--ui);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,p{margin:0;font-weight:300}
svg.i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.scene{position:fixed;inset:0;background:radial-gradient(620px 380px at 46% 34%,rgba(92,96,62,.5),transparent 70%),radial-gradient(520px 360px at 22% 58%,rgba(52,62,86,.42),transparent 70%),radial-gradient(420px 300px at 12% 96%,rgba(96,52,30,.32),transparent 70%),var(--bg)}
.scene::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 25%,rgba(8,8,9,.82) 95%)}
.page{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:22px 20px 40px}
.brand{font-size:19px;letter-spacing:.02em}.brand b{font-weight:500}
.meta{font-size:13px;color:var(--dim);margin:4px 0 20px}
.wall{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.opt{display:grid;gap:8px}
.opt>span{font-size:11.5px;color:var(--mute);letter-spacing:.06em}
.opt>span b{font-weight:400;color:var(--text);margin-right:6px}
.t{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(120%);backdrop-filter:blur(24px) saturate(120%);border:1px solid var(--edge);border-radius:var(--r);padding:14px 16px;min-width:0;overflow:hidden;width:330px}
.t.sel{background:linear-gradient(150deg,rgba(210,210,214,.42),rgba(90,90,94,.3) 45%,rgba(28,28,30,.66));border-color:var(--edge-2)}
.th{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.th h2{font-size:13.5px;color:var(--text)}
.th small{display:block;font-size:11.5px;color:var(--mute);margin-top:1px}
.th svg{color:var(--dim)}
.big{font-size:40px;font-weight:200;letter-spacing:-.02em;line-height:1}
.big small{font-size:15px;color:var(--mute);font-weight:300;margin-left:3px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--edge-2);border-radius:999px;padding:2px 10px;font-size:11.5px;color:var(--text);white-space:nowrap}
.xl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute);margin-top:2px}
.ticks{position:relative;height:16px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.34) 0 1px,transparent 1px 5px)}
.ticks i{position:absolute;top:-3px;bottom:-3px;width:9px;margin-left:-4px;border:1px solid var(--text);border-radius:2px;background:rgba(10,10,11,.9);transition:left .5s var(--ease)}
.pt{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--text);transform:translate(-50%,-50%);box-shadow:0 0 0 5px rgba(255,255,255,.12)}
.lev{position:absolute;right:6px;font-size:19px;font-weight:200;color:var(--text);transform:translateY(-50%);background:rgba(10,10,11,.5);padding:0 6px;border-radius:6px;white-space:nowrap}
.lev small{font-size:11.5px;color:var(--dim);margin-left:4px}
.lev.f{color:var(--dim)}
.xa{position:absolute;bottom:2px;font-size:13px;color:var(--mute);transform:translateX(-50%)}
.tagc{position:absolute;left:3%;top:6%;padding:14px 16px;border-radius:18px;background:rgba(150,150,154,.22);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--edge-2)}
.tagc h2{font-size:15px}.tagc p{font-size:12px;color:var(--dim)}.tagc .big{margin-top:14px}
.tagc svg{position:absolute;right:14px;top:14px;color:var(--dim)}
.ring{position:absolute;width:112px;height:112px;border:1px dashed rgba(255,255,255,.7);border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center}
.ring span{width:54px;height:54px;border-radius:50%;background:rgba(190,190,194,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;font-size:15px}

/* 1 rulers */
.wr{margin-top:11px}
.wh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.wh span{font-size:13.5px}
.wh span small{font-size:11.5px;color:var(--mute);margin-left:8px}
.wh b{font-size:22px;font-weight:200}
.t .xl.end{margin-top:8px}

/* 2 dial */
.dial{display:block;width:100%;height:268px;overflow:visible}
.dial .rg{fill:none;stroke:rgba(255,255,255,.7);stroke-dasharray:4 5}
.dial .day{fill:none;stroke:rgba(255,255,255,.1);stroke-width:14}
.dial .tk{stroke:rgba(255,255,255,.34)}
.dial .tk.m{stroke:rgba(255,255,255,.8)}
.dial text{font-family:Outfit;fill:var(--text)}
.dial .hr{font-size:10.5px;fill:var(--mute);text-anchor:middle}
.dial .halo{fill:rgba(255,255,255,.12)}
.dial .dot{fill:var(--text)}
.dial .dot.me{fill:#0a0a0b;stroke:var(--text);stroke-width:1.2}
.dial .nm{font-size:11.5px;fill:var(--dim)}
.dial .tm{font-size:14px;font-weight:300}
.dial .hub{fill:rgba(190,190,194,.3)}
.dial .ht{font-size:21px;font-weight:200;text-anchor:middle}
.dial .hs{font-size:10.5px;fill:var(--dim);text-anchor:middle}

/* 3 curve */
.hero{position:relative;height:330px;width:674px;overflow:hidden;border-radius:16px;border:1px solid var(--edge);background:rgba(28,28,30,.3)}
.hero svg.c{position:absolute;inset:0;width:100%;height:100%}
.hero .l{fill:none;stroke:var(--text);stroke-width:1.1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.hero .d{stroke:rgba(255,255,255,.34);stroke-dasharray:10 9;vector-effect:non-scaling-stroke}
.hero .d.t{stroke:rgba(255,255,255,.8)}
.hero .tagc{width:168px}
.hero .tagc .big{font-size:34px}
.cl{position:absolute;transform:translate(-50%,0);font-size:11.5px;color:var(--dim);white-space:nowrap;text-align:center;line-height:1.25;background:rgba(10,10,11,.5);padding:2px 7px;border-radius:6px}
.cl b{display:block;font-size:15px;font-weight:300;color:var(--text)}
.hero .pt,.hero .cl,.hero .ring{transition:left .5s var(--ease),top .5s var(--ease)}

/* 4 ladder */
.lad{position:relative;height:262px;margin-top:4px}
.ln{position:absolute;left:0;right:0;height:1px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.34) 0 10px,transparent 10px 19px)}
.ln.me{background:repeating-linear-gradient(90deg,rgba(255,255,255,.8) 0 10px,transparent 10px 19px)}
.ln em{position:absolute;left:0;bottom:4px;font-style:normal;font-size:11.5px;color:var(--dim)}
.ln.me em{color:var(--text);left:16px}
.ln .lev{right:0;top:0;font-size:17px;background:rgba(18,18,20,.92)}
.ln .pt{left:5px;top:0}

/* 5 headline */
.row5{display:flex;align-items:flex-end;justify-content:space-between;margin:2px 0 12px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--edge)}
.q small{display:block;font-size:11.5px;color:var(--mute)}
.q div{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.q b{font-size:22px;font-weight:200}
.q i{font-style:normal;font-size:11.5px;color:var(--dim)}
</style>
</head>
<body>
<div class="scene"></div>
<div class="page">
  <div class="brand"><b>Command</b> Station</div>
  <p class="meta">World clock, five takes built from the dashboard's own parts. All live. Cities are placeholders.</p>
  <div class="wall">
    <div class="opt"><span><b>A</b>RULERS</span><section class="t dev" id="A"></section></div>

  </div>
</div>

 {n:"London",tz:"Europe/London"},
 {n:"Seoul",tz:"Asia/Seoul"},
 {n:"Sydney",tz:"Australia/Sydney"},
].filter(c=>c.tz!==LOCAL_TZ);
const CITIES=[{n:localName,tz:LOCAL_TZ,me:true},...ALL];
function parts(tz,d){
  const f=new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false,weekday:"short",day:"numeric",month:"short"}).formatToParts(d);
  const g=t=>f.find(p=>p.type===t).value;
  const h=+g("hour")%24,m=+g("minute"),s=+g("second");
  const off=Math.round((new Date(d.toLocaleString("en-US",{timeZone:tz})).getTime()-new Date(d.toLocaleString("en-US",{timeZone:"UTC"})).getTime())/60000);
  const p2=n=>String(n).padStart(2,"0");
  return {h,m,s,hf:h+m/60+s/3600,off,day:g("weekday"),date:g("day")+" "+g("month"),hm:p2(h)+":"+p2(m),ss:p2(s)};
}
const rel=(o,b)=>{const x=(o-b)/60;return x===0?"here":(x>0?"+":"−")+Math.abs(x)+" h"};
const $=id=>document.getElementById(id);

/* A */
$("A").innerHTML=`<div class="th"><div><h2>World clock</h2><small>Each ruler is that city's day, 00 to 24</small></div>${ICON}</div>`+
 CITIES.map((c,i)=>`<div class="wr"><div class="wh"><span>${c.n}<small id="As${i}"></small></span><b id="At${i}"></b></div><div class="ticks"><i id="Am${i}"></i></div></div>`).join("")+
 `<div class="xl end"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>`;

/* B */
const BX=149,BY=134,BR=92;
const pol=(hf,r)=>{const a=hf/24*2*Math.PI;return [BX+r*Math.sin(a),BY-r*Math.cos(a)]};
let b=`<div class="th"><div><h2>World clock</h2><small>One 24-hour ring. Lower half is daytime</small></div>${ICON}</div><svg class="dial" viewBox="0 0 298 268">`;
{const [x1,y1]=pol(6,BR),[x2,y2]=pol(18,BR);b+=`<path class="day" d="M${x1} ${y1}A${BR} ${BR} 0 0 1 ${x2} ${y2}"/>`;}
b+=`<circle class="rg" cx="${BX}" cy="${BY}" r="${BR}"/>`;
for(let h=0;h<24;h++){const m=h%6===0,[x1,y1]=pol(h,BR-(m?11:6)),[x2,y2]=pol(h,BR-2);b+=`<line class="tk${m?" m":""}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;}
[0,6,12,18].forEach(h=>{const [x,y]=pol(h,BR-21);b+=`<text class="hr" x="${x}" y="${y+3.5}">${String(h).padStart(2,"0")}</text>`;});
b+=`<circle class="hub" cx="${BX}" cy="${BY}" r="36"/><text class="ht" id="Bh" x="${BX}" y="${BY+4}"></text><text class="hs" x="${BX}" y="${BY+18}">you</text>`;
CITIES.forEach((c,i)=>{b+=`<g id="Bg${i}"><circle class="halo" r="10.5"/><circle class="dot${c.me?" me":""}" r="5.5"/></g><text class="nm" id="Bn${i}">${c.me?"You":c.n}</text><text class="tm" id="Bt${i}"></text>`;});
$("B").innerHTML=b+"</svg>";

/* C */
const CW=600,CH=330,HZ=178,AMP=112;
const cy=hf=>HZ-AMP*Math.sin((hf-6)/24*2*Math.PI);
let pts=[];for(let h=0;h<=24;h+=.25)pts.push((h/24*CW).toFixed(1)+","+cy(h).toFixed(1));
$("C").innerHTML=`<svg class="c" viewBox="0 0 ${CW} ${CH}" preserveAspectRatio="none"><line class="d" x1="0" x2="${CW}" y1="${HZ-AMP}" y2="${HZ-AMP}"/><line class="d t" x1="0" x2="${CW}" y1="${HZ}" y2="${HZ}"/><line class="d" x1="0" x2="${CW}" y1="${HZ+AMP}" y2="${HZ+AMP}"/><polyline class="l" points="${pts.join(" ")}"/></svg>`+
 `<span class="lev f" style="top:${(HZ-AMP)/CH*100}%">12<small>noon</small></span><span class="lev" style="top:${HZ/CH*100}%">06 · 18<small>horizon</small></span><span class="lev f" style="top:${(HZ+AMP)/CH*100}%">00<small>midnight</small></span>`+
 [["3%","00"],["25%","06"],["50%","12"],["75%","18"]].map(([l,t])=>`<span class="xa" style="left:${l}">${t}</span>`).join("")+
 `<div class="ring" id="Cr"><span id="Crt"></span></div>`+
 ALL.map((c,i)=>`<div class="pt" id="Cp${i}"></div><div class="cl" id="Cl${i}">${c.n}<b id="Ct${i}"></b></div>`).join("")+
 `<div class="tagc">${ICON}<h2>World clock</h2><p>Above the line is daytime</p><div class="big"><span id="Cb"></span><small id="Cs"></small></div></div>`;

/* D */
$("D").innerHTML=`<div class="th"><div><h2>World clock</h2><small>Higher is later than you, lower is earlier</small></div>${ICON}</div><div class="lad" id="Dl">`+
 CITIES.map((c,i)=>`<div class="ln${c.me?" me":""}" id="Dn${i}">${c.me?'<div class="pt"></div>':""}<em>${c.me?"You · "+c.n:c.n}</em><span class="lev" id="Dv${i}"></span></div>`).join("")+`</div>`;

/* E */
$("E").innerHTML=`<div class="th"><div><h2>Local time</h2><small>${localName}</small></div>${ICON}</div>`+
 `<div class="row5"><div class="big"><span id="Eb"></span><small id="Es"></small></div><span class="chip" id="Ed"></span></div>`+
 `<div class="ticks"><i id="Em"></i></div><div class="xl"><span>00</span><span id="Ep"></span><span>24</span></div>`+
 `<div class="quad">`+ALL.map((c,i)=>`<div class="q"><small>${c.n}</small><div><b id="Et${i}"></b><i id="Eo${i}"></i></div></div>`).join("")+`</div>`;

function tick(){
  const now=new Date(),P=CITIES.map(c=>parts(c.tz,now)),me=P[0];
  CITIES.forEach((c,i)=>{const p=P[i];
    $("As"+i).textContent=c.me?"here":p.day+" · "+rel(p.off,me.off);
    $("At"+i).textContent=p.hm; $("Am"+i).style.left=(p.hf/24*100)+"%";
    const [x,y]=pol(p.hf,BR); $("Bg"+i).setAttribute("transform",`translate(${x} ${y})`);
    const a=p.hf/24*2*Math.PI,sx=Math.sin(a),cx=Math.cos(a),[lx,ly]=pol(p.hf,BR+17);
    const anchor=sx>.3?"start":sx<-.3?"end":"middle",dy=cx>.6?-16:cx<-.6?8:-4;
    const n=$("Bn"+i),t=$("Bt"+i);
    n.setAttribute("x",lx);n.setAttribute("y",ly+dy);n.setAttribute("text-anchor",anchor);
    t.setAttribute("x",lx);t.setAttribute("y",ly+dy+14);t.setAttribute("text-anchor",anchor);t.textContent=p.hm;
  });
  $("Bh").textContent=me.hm;
  // C: your ring, then the other cities, flipping a label when two sit close
  $("Cr").style.left=(me.hf/24*100)+"%";$("Cr").style.top=(cy(me.hf)/CH*100)+"%";$("Crt").textContent=me.hm;
  $("Cb").textContent=me.hm;$("Cs").textContent=me.ss;
  const order=ALL.map((c,i)=>({i,p:P[i+1]})).sort((a,b)=>a.p.hf-b.p.hf);let last=null;
  order.forEach(o=>{const lp=o.p.hf/24*100,y=cy(o.p.hf);let up=y<HZ;
    if(last&&lp-last.lp<15)up=!last.up;
    if(Math.abs(o.p.hf-me.hf)<3.2)up=y>cy(me.hf)?false:true;
    if(lp<34)up=false; if(lp>80)up=true;
    $("Cp"+o.i).style.left=lp+"%";$("Cp"+o.i).style.top=(y/CH*100)+"%";
    const l=$("Cl"+o.i);l.style.left=Math.min(84,Math.max(8,lp))+"%";l.style.top=(up?y-52:y+14)+"px";
    $("Ct"+o.i).textContent=o.p.hm;last={lp,up};});
  // D: levels by hour difference, kept at least 34px apart
  const H=$("Dl").clientHeight-30,offs=P.map(p=>(p.off-me.off)/60),mx=Math.max(...offs),mn=Math.min(...offs),span=Math.max(1,mx-mn);
  const rows=CITIES.map((c,i)=>({i,y:24+(mx-offs[i])/span*H})).sort((a,b)=>a.y-b.y);
  for(let k=1;k<rows.length;k++)if(rows[k].y-rows[k-1].y<34)rows[k].y=rows[k-1].y+34;
  const over=rows[rows.length-1].y-(H+24);if(over>0)for(let k=rows.length-1;k>=0;k--){rows[k].y-=over;if(k&&rows[k].y-rows[k-1].y>=34)break;}
  rows.forEach(r=>{const p=P[r.i];$("Dn"+r.i).style.top=r.y+"px";
    $("Dv"+r.i).innerHTML=p.hm+`<small>${CITIES[r.i].me?p.day:rel(p.off,me.off)+(p.day!==me.day?" · "+p.day:"")}</small>`;});
  // E
  $("Eb").textContent=me.hm;$("Es").textContent=me.ss;$("Ed").textContent=me.day+" "+me.date;
  $("Em").style.left=(me.hf/24*100)+"%";$("Ep").textContent=Math.round(me.hf/24*100)+"% of the day";
  ALL.forEach((c,i)=>{const p=P[i+1];$("Et"+i).textContent=p.hm;$("Eo"+i).textContent=rel(p.off,me.off)+(p.day!==me.day?" · "+p.day:"");});
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
