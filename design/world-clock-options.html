:root{--bg:#0a0a0b;--text:#f2f2f3;--dim:#a2a2a8;--mute:#6c6c72;--edge:rgba(255,255,255,.1);--edge2:rgba(255,255,255,.16);--orange:#f0883e;--glass:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.018));--day:#e8e2c9;--night:#3b4a6b}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(1200px 700px at 30% -10%,#26261f 0,#0a0a0b 60%);color:var(--text);font-family:Outfit,system-ui,sans-serif;font-weight:200;min-height:100vh;padding:28px 16px 40px}
h1{font-size:22px;font-weight:300;margin-bottom:4px}
.sub{color:var(--dim);font-size:13px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;max-width:1280px}
.opt{display:flex;flex-direction:column;gap:8px}
.opt>b{font-weight:400;font-size:12px;color:var(--dim);letter-spacing:.04em}
.card{background:var(--glass);border:1px solid var(--edge2);border-radius:16px;padding:14px 16px;height:330px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.card h2{font-size:15px;font-weight:400}
.card small{font-size:12px;color:var(--dim)}
.th{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;background:var(--night)}
.dot.day{background:var(--day);box-shadow:0 0 8px rgba(232,226,201,.5)}
.t{font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column;flex:1;justify-content:space-between}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;padding:2px 0;border-bottom:1px solid var(--edge)}
.row:last-child{border:0}
.row .c{font-size:14px;font-weight:400}
.row .c small{display:block;margin-top:1px;font-weight:200}
.row .tm{font-size:26px;font-weight:200;line-height:1}
.row .tm i{font-style:normal;font-size:13px;color:var(--mute);margin-left:4px}
.ana{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px;flex:1;align-content:center}
.ac{display:flex;flex-direction:column;align-items:center;gap:5px}
.face{width:82px;height:82px;border-radius:50%;border:1px solid var(--edge2);position:relative;background:rgba(255,255,255,.03)}
.face.day{background:rgba(232,226,201,.14)}
.face i{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;background:var(--text);border-radius:2px}
.face .h{width:2.5px;height:22px;margin-left:-1.25px}
.face .m{width:1.5px;height:32px;margin-left:-.75px;opacity:.9}
.face .s{width:1px;height:35px;margin-left:-.5px;background:var(--orange)}
.face u{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--text)}
.face em::before{content:"";position:absolute;left:50%;top:3px;width:1px;height:5px;background:var(--mute);transform:translateX(-50%)}
.face em{position:absolute;inset:0}
.ac .n{font-size:13px;font-weight:400}
.ac .d{font-size:11.5px;color:var(--dim)}
.map{flex:1;position:relative;min-height:0}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.land{fill:rgba(255,255,255,.17);stroke:rgba(255,255,255,.28);stroke-width:.4}
.nightp{fill:rgba(4,6,14,.62)}
.pin circle{fill:var(--text)}
.pin text{fill:var(--text);font-family:Outfit;font-size:17px;font-weight:400;text-anchor:middle}
.pin .lb{fill:rgba(10,10,11,.72)}
.pin .tt{fill:var(--dim);font-size:15px;font-weight:200}
.tl{display:flex;flex-direction:column;gap:11px;flex:1;justify-content:center;position:relative;padding-top:12px}
.tr{display:grid;grid-template-columns:78px 1fr 58px;align-items:center;gap:8px;font-size:13px}
.tr .c{font-weight:400}
.bar{height:16px;border-radius:8px;background:rgba(59,74,107,.5);position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;background:var(--day);opacity:.9}
.tr .tm{text-align:right;font-size:17px}
.nowline{position:absolute;top:8px;bottom:0;width:0;border-left:1px dashed rgba(255,255,255,.8)}
.axis{position:absolute;left:86px;right:66px;top:-6px;display:flex;justify-content:space-between;font-size:10px;color:var(--mute)}
.feat{display:flex;flex-direction:column;flex:1;justify-content:space-between}
.big{font-size:68px;font-weight:200;line-height:1;margin-top:4px}
.big sup{font-size:20px;color:var(--orange);vertical-align:top;margin-left:6px;position:relative;top:8px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chip{border:1px solid var(--edge);border-radius:12px;padding:8px 4px;text-align:center;background:rgba(255,255,255,.03)}
.chip b{display:block;font-weight:400;font-size:11.5px;color:var(--dim)}
.chip span{font-size:15px}
.chip.day{border-color:rgba(232,226,201,.35)}
</style>
</head>

const LOCAL_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
function parts(tz, d=new Date()){

function tick(){
